version: '3.8'

services:
  dynamodb-local:
    image: public.ecr.aws/aws-dynamodb-local/aws-dynamodb-local:latest
    container_name: dynamodb-local
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    volumes:
      - ./dynamodb_data:/home/dynamodblocal/data
    networks:
      - voice-network

  stt:
    build:
      context: docker/sensevoice
      dockerfile: Dockerfile
    container_name: sensevoice
    ports:
      - "50000:50000"
    command: >
      /bin/bash -c "source /opt/conda/etc/profile.d/conda.sh && conda activate sensevoice && uvicorn server:app --host 0.0.0.0 --port 50000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['2']
              capabilities: [gpu]
    networks:
      - voice-network

  tts:
    profiles: ["local-cosyvoice"]
    build:
      context: docker/cosyvoice
      dockerfile: Dockerfile
    container_name: cosyvoice
    ports:
      - "50001:50001"
    command: >
      /bin/bash -c "source /opt/conda/etc/profile.d/conda.sh && conda activate cosyvoice && uvicorn async_cosyvoice.runtime.fastapi.server:app --host 0.0.0.0 --port 50001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['2']
              capabilities: [gpu]
    networks:
      - voice-network

  coturn:
    image: coturn/coturn:latest
    container_name: coturn
    ports:
      - "3478:3478"
      - "3478:3478/udp"
    command: >
      /bin/sh -c 'turnserver -a -o -v -n --no-dtls --no-tls -u test:test -r myrealm -X $${EXTERNAL_IP:-127.0.0.1}'
    networks:
      - voice-network

  voicebot:
    build:
      context: .
      dockerfile: docker/voicebot/Dockerfile
    container_name: voicebot
    ports:
      - "8080:8080"
    environment:
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
      - AWS_REGION_NAME=us-east-1
      - DYNAMODB_HOST=http://dynamodb-local:8000
      - STUNNER_USER=test
      - STUNNER_PASSWORD=test
      - OPENAI_API_KEY=${OPENAI_API_KEY:-dummy}
      - TTS_MODEL=${TTS_MODEL:-openai/Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice}
      - TTS_API_BASE=${TTS_API_BASE:-http://host.docker.internal:8001/v1}
      - TTS_API_KEY=${TTS_API_KEY:-EMPTY}
      - TTS_VOICES=${TTS_VOICES:-vivian,ryan,aiden}
      - TTS_OUTPUT_SAMPLE_RATE=${TTS_OUTPUT_SAMPLE_RATE:-24000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      /bin/bash -c "source /opt/conda/etc/profile.d/conda.sh && conda activate voicebot && cd backend && uvicorn app:app --host 0.0.0.0 --port 8080"
    depends_on:
      - dynamodb-local
      - stt
    networks:
      - voice-network

networks:
  voice-network:
    driver: bridge
