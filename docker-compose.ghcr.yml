version: '3.8'

services:
  dynamodb-local:
    image: public.ecr.aws/aws-dynamodb-local/aws-dynamodb-local:latest
    container_name: dynamodb-local
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    volumes:
      - ./dynamodb_data:/home/dynamodblocal/data
    networks:
      - voice-network

  stt:
    profiles: [ "local-sensevoice" ]
    image: ghcr.io/robin021/agentic-voice-assistant-local/stt:latest
    container_name: sensevoice
    ports:
      - "50000:50000"
    command: >
      /bin/bash -c "source /opt/conda/etc/profile.d/conda.sh && conda activate sensevoice && python -c 'import pathlib,re; p=pathlib.Path(\"/var/lib/sensevoice/.conda/envs/sensevoice/lib/python3.10/site-packages/torchaudio/_extension/utils.py\"); s=p.read_text(); pattern=r\"(?m)^(?P<indent>[ \\t]*)torch\\.ops\\.load_library\\((?P<target>[^)]+)\\)$\"; repl=lambda m: \"{indent}try:\\n{indent}    torch.ops.load_library({target})\\n{indent}except Exception:\\n{indent}    return False\".format(indent=m.group(\"indent\"), target=m.group(\"target\")); patched, count = re.subn(pattern, repl, s, count=1); assert count == 1, \"torchaudio patch target not found\"; p.write_text(patched)' && export LD_LIBRARY_PATH=/usr/local/cuda/lib64:\$LD_LIBRARY_PATH && uvicorn server:app --host 0.0.0.0 --port 50000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '2' ]
              capabilities: [ gpu ]
    networks:
      - voice-network

  tts:
    profiles: [ "local-cosyvoice" ]
    image: ghcr.io/robin021/agentic-voice-assistant-local/tts:latest
    container_name: cosyvoice
    ports:
      - "50001:50001"
    command: >
      /bin/bash -c "source /opt/conda/etc/profile.d/conda.sh && conda activate cosyvoice && pip install 'vllm' 'numpy==1.26.4' -i https://mirrors.aliyun.com/pypi/simple/ && export LD_LIBRARY_PATH=/usr/local/cuda/lib64:\$LD_LIBRARY_PATH && uvicorn async_cosyvoice.runtime.fastapi.server:app --host 0.0.0.0 --port 50001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '2' ]
              capabilities: [ gpu ]
    networks:
      - voice-network

  coturn:
    image: docker.memes.xin/coturn/coturn:latest
    container_name: coturn
    ports:
      - "3478:3478"
      - "3478:3478/udp"
    command: >
      /bin/sh -c 'turnserver -a -o -v -n --no-dtls --no-tls -u test:test -r myrealm -X $${EXTERNAL_IP:-127.0.0.1}'
    networks:
      - voice-network

  voicebot:
    image: ghcr.io/robin021/agentic-voice-assistant-local/voicebot:latest
    container_name: voicebot
    ports:
      - "8080:8080"
    environment:
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
      - AWS_REGION_NAME=us-east-1
      - DYNAMODB_HOST=http://dynamodb-local:8000
      - STUNNER_USER=test
      - STUNNER_PASSWORD=test
      - BASIC_LLM_MODEL=${BASIC_LLM_MODEL:-gpt-4o}
      - BASIC_LLM_API_BASE=${BASIC_LLM_API_BASE:-}
      - BASIC_LLM_API_KEY=${BASIC_LLM_API_KEY:-dummy}
      - ASR_MODEL=${ASR_MODEL:-openai/sensevoice}
      - ASR_API_BASE=${ASR_API_BASE:-http://host.docker.internal:50000/v1}
      - ASR_API_KEY=${ASR_API_KEY:-EMPTY}
      - TTS_MODEL=${TTS_MODEL:-openai/Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice}
      - TTS_API_BASE=${TTS_API_BASE:-http://host.docker.internal:8001/v1}
      - TTS_API_KEY=${TTS_API_KEY:-EMPTY}
      - TTS_VOICES=${TTS_VOICES:-}
      - TTS_OUTPUT_SAMPLE_RATE=${TTS_OUTPUT_SAMPLE_RATE:-24000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      /bin/bash -c "source /opt/conda/etc/profile.d/conda.sh && conda activate voicebot && python -c \"import litellm.main; import re; f=litellm.main.__file__; s=open(f).read(); s=re.sub(r'n*vertex_text_to_speech=Nonen*', '', s); open(f,'w').write(s + chr(10) + 'vertex_text_to_speech=None' + chr(10))\" && cd backend && uvicorn app:app --host 0.0.0.0 --port 8080"
    depends_on:
      - dynamodb-local
    networks:
      - voice-network

networks:
  voice-network:
    driver: bridge
